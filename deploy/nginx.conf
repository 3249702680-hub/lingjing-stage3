# Docker's embedded DNS must be consulted again after app container recreation.
resolver 127.0.0.11 valid=5s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Allows a 10 MiB image plus its multipart form envelope.
    client_max_body_size 12m;
    client_body_timeout 60s;

    location / {
        set $app_backend app:8000;
        # Preserve the original path and query, including Gradio's /ui/ prefix.
        proxy_pass http://$app_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        # Gradio versions can use WebSockets or streamed SSE queue responses.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
