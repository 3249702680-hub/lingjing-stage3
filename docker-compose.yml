services:
  app:
    build: .
    image: lingjing-stage3:day4
    init: true
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    environment: &app_environment
      REDIS_URL: redis://redis:6379/0
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      SQLSERVER_AUTH: ${SQLSERVER_AUTH:-sql}
      SQLSERVER_HOST: ${SQLSERVER_HOST:-not-configured}
      SQLSERVER_PORT: ${SQLSERVER_PORT:-1433}
      SQLSERVER_DATABASE: ${SQLSERVER_DATABASE:-lingjing_stage3}
      SQLSERVER_DRIVER: ${SQLSERVER_DRIVER:-ODBC Driver 18 for SQL Server}
      SQLSERVER_USERNAME: ${SQLSERVER_USERNAME:-}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:-}
      SQLSERVER_TRUST_SERVER_CERTIFICATE: ${SQLSERVER_TRUST_SERVER_CERTIFICATE:-no}
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    stop_grace_period: 30s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    image: lingjing-stage3:day4
    init: true
    command: ["python", "worker.py"]
    environment: *app_environment
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; from rq import Worker; from job_queue import redis_connection; assert any(w.name == 'analysis-' + socket.gethostname() for w in Worker.all(connection=redis_connection()))"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 390s

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  uploads:
  redis_data:
